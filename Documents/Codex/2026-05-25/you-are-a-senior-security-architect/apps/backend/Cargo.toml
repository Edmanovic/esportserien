[package]
name = "espass-backend"
version = "0.1.0"
description = "Minimal encrypted sync API prototype for ESPASS."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.7.5"
espass-shared-types = { version = "0.1.0", path = "../../packages/shared-types" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.61"
time = { version = "0.3.36", features = ["serde", "formatting"] }
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.5.2", features = ["trace"] }
uuid = { version = "1.8.0", features = ["serde", "v4"] }
argon2       = { version = "0.5", features = ["password-hash"] }
hex          = "0.4"
jsonwebtoken = "9"
rand         = "0.8"

[lints]
workspace = true
