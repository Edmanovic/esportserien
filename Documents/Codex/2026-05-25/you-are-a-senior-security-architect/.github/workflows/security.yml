name: security

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  rust-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate pinned toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Test
        run: cargo test --workspace
      - name: Nextest
        run: |
          cargo install cargo-nextest --locked
          cargo nextest run --workspace
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Dependency audit
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Dependency policy
        run: cargo deny check
      - name: Hakari workspace dependency check
        run: |
          cargo install cargo-hakari --locked
          cargo hakari generate --diff
      - name: Unused dependency check
        run: |
          cargo install cargo-udeps --locked
          cargo +nightly udeps --workspace --all-targets
      - name: Miri smoke
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          cargo +nightly miri test -p espass-crypto-core --lib
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: semgrep.yml
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: gitleaks.toml
      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: -r .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
